name: AI QA Portfolio Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -v

  rag-evals:
    # LLM-judged quality gate: runs only when the ANTHROPIC_API_KEY repo secret is configured.
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: env.ANTHROPIC_API_KEY != ''
        run: python -m pip install -r requirements-rag.txt
      - if: env.ANTHROPIC_API_KEY != ''
        run: python -m rag.vector_store
      - if: env.ANTHROPIC_API_KEY != ''
        run: deepeval test run evals/
      - if: always() && env.ANTHROPIC_API_KEY != ''
        run: python -m evals.run_evaluation
      - if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
